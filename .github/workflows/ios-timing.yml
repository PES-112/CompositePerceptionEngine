# Build the CPE on-device timing app (ios/CPETiming) on a macOS runner, and optionally ship it to
# TestFlight so it can run on an iPhone 17 Pro Max without anyone on the team owning a Mac.
# How to run it on a phone: ios/CPETiming/README.md.
name: ios-timing

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Archive, sign and upload to TestFlight (needs the App Store Connect secrets)"
        type: boolean
        default: false
      frames:
        description: "SANPO frames to bundle"
        default: "300"
  push:
    paths:
      - "ios/**"
      - "training/scripts/export_gru_coreml.py"
      - "training/scripts/export_yolo26n_edge.py"
      - ".github/workflows/ios-timing.yml"

env:
  # App Store uploads need the current Xcode/SDK (Xcode 26 since April 2026). Point MACOS_RUNNER (repo
  # variable) at a runner image that has it if the default image is older.
  CPE_BUNDLE_ID: ${{ vars.CPE_BUNDLE_ID || 'edu.pes.cpe.timing' }}
  CPE_TEAM_ID: ${{ secrets.CPE_TEAM_ID }}

jobs:
  build:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies (export + bundle only)
        run: |
          python -m pip install --upgrade pip
          # coremltools 9.0 is tested up to torch 2.7.0; newer torch breaks traced-graph conversion.
          python -m pip install "torch==2.7.0" "coremltools==9.0" ultralytics numpy pandas pillow scipy
          python -c "import torch, coremltools, ultralytics, numpy; print(torch.__version__, coremltools.__version__, ultralytics.__version__, numpy.__version__)"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bundle SANPO frames + recorded GRU inputs
        run: python ios/CPETiming/prepare_bundle.py --frames "${{ inputs.frames || '300' }}"

      - name: Export both models to Core ML
        run: python ios/CPETiming/prepare_bundle.py --export-only

      - name: Keep the exported models and the numeric check
        uses: actions/upload-artifact@v4
        with:
          name: coreml-exports
          path: |
            ios/CPETiming/Models/
            models/GRU/exports/*.json
            ios/CPETiming/Resources/bundle.json

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios/CPETiming && xcodegen generate

      - name: Build (unsigned, device SDK)
        run: |
          xcodebuild -project ios/CPETiming/CPETiming.xcodeproj -scheme CPETiming \
            -destination 'generic/platform=iOS' -configuration Release \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Archive and upload to TestFlight
        if: ${{ inputs.testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
        run: |
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8_BASE64" && test -n "$CPE_TEAM_ID" \
            || { echo "Missing App Store Connect secrets; see ios/CPETiming/README.md"; exit 1; }
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          cd ios/CPETiming
          sed "s/TEAM_ID_PLACEHOLDER/$CPE_TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -project CPETiming.xcodeproj -scheme CPETiming -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CPETiming.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} $AUTH archive | tail -n 40
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CPETiming.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH
          rm -f "$KEY"
