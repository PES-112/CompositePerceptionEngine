# XcodeGen spec (https://github.com/yonaskolb/XcodeGen): `xcodegen generate` writes CPETiming.xcodeproj.
# The .xcodeproj is generated, never committed. Models/ and Resources/ are filled by prepare_bundle.py.
name: CPETiming
options:
  bundleIdPrefix: edu.pes.cpe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${CPE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CPETiming:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Models           # *.mlpackage: Xcode compiles each to <name>.mlmodelc in the app bundle
        optional: true
      - path: Resources
        type: folder           # copied as a folder reference: Resources/Frames/*.jpg, gru_*.bin, bundle.json
        optional: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CPE Timing
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true                 # timing CSVs appear in the Files app
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${CPE_BUNDLE_ID}
